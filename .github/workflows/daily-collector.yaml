name: Daily AHI Evidence Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", ".github/workflows/daily-collector.yaml", "public_shards_test.py"]
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: write

concurrency:
  group: ahi-daily-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pinned signing dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Capture MCP Registry
        run: python collector/collect.py

      - name: Compare latest complete snapshots
        run: python collector/compare.py

      - name: Append evidence and create Merkle checkpoint
        env:
          AHI_SIGNING_KEY_B64: ${{ secrets.AHI_SIGNING_KEY_B64 }}
          AHI_SIGNING_PUBLIC_KEY_B64: ${{ vars.AHI_SIGNING_PUBLIC_KEY_B64 }}
        run: python collector/integrity.py

      - name: Build public status/catalog
        run: python collector/build_public_index.py

      - name: Verify retention policy
        run: python collector/cleanup.py

      - name: Run security regression tests
        run: |
          python security_self_test.py
          python security_pipeline_test.py
          python integrity_recovery_test.py
          python public_shards_test.py

      - name: Reject symlinks in generated evidence
        shell: bash
        run: |
          if find data/snapshots data/changes data/evidence data/checkpoints data/corrections data/public web/data -type l -print -quit | grep -q .; then
            echo "Symlink found in generated evidence; refusing to commit."
            exit 1
          fi

      - name: Commit generated evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local core.hooksPath /dev/null
          git config --local user.name "agent-history-index-bot"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/changes data/evidence data/checkpoints data/corrections data/public web/data
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "Capture daily AHI evidence"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
