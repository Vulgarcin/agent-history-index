name: Daily AHI Evidence Capture

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: write

concurrency:
  group: ahi-daily-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install optional signing dependency
        run: python -m pip install -r requirements.txt

      - name: Capture MCP Registry
        run: python collector/collect.py

      - name: Compare latest complete snapshots
        run: python collector/compare.py

      - name: Append evidence and create Merkle checkpoint
        env:
          AHI_SIGNING_KEY_B64: ${{ secrets.AHI_SIGNING_KEY_B64 }}
        run: python collector/integrity.py

      - name: Build public status
        run: python collector/build_public_index.py

      - name: Verify retention policy
        run: python collector/cleanup.py

      - name: Commit generated evidence
        run: |
          git config user.name "agent-history-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/changes data/evidence data/checkpoints data/public web/data/status.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Capture daily AHI evidence"
            git push
          fi
