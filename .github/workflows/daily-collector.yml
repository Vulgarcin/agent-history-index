name: Daily MCP Registry Snapshot

"on":
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run collector
        run: python collector/collect.py

      - name: Compare snapshots
        run: python collector/compare.py

      - name: Commit new snapshot
        run: |
          git config user.name "agent-history-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
            exit 0
          fi
          git commit -m "Add daily MCP registry snapshot"
          git push
